kernel:
  description: FP16 RMS normalization with FP32 accumulation, affine weight and reciprocal
    RMS output.
  name: rms_norm
  namespace: team
schema_version: 2
spec:
  cases:
    recipe_file: recipes.yaml
    tensor_contract_file: tensor-contract.yaml
  interface:
    inputs:
    - x
    - gamma
    outputs:
    - y
    - rstd
  reference:
    file: reference.py
    function: reference
  validation:
    default_atol: 0.0001
    default_rtol: 0.001
    metric: torch_close
  version: 1
