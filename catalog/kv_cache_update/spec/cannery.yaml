kernel:
  description: Scatter packed K/V token rows into a fused cache; skip invalid slots
    and preserve untouched rows.
  name: kv_cache_update
  namespace: team
schema_version: 2
spec:
  cases:
    recipe_file: recipes.yaml
    tensor_contract_file: tensor-contract.yaml
  interface:
    inputs:
    - updates
    - slots
    - cache
    outputs:
    - updated
  reference:
    file: reference.py
    function: reference
  validation:
    default_atol: 0.0001
    default_rtol: 0.001
    metric: torch_close
  version: 1
