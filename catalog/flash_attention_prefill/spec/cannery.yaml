kernel:
  description: Causal FP16 flash attention prefill, output and natural-log softmax
    normalizer, no dropout.
  name: flash_attention_prefill
  namespace: team
schema_version: 2
spec:
  cases:
    recipe_file: recipes.yaml
    tensor_contract_file: tensor-contract.yaml
  interface:
    inputs:
    - q
    - k
    - v
    outputs:
    - out
    - lse
  reference:
    file: reference.py
    function: reference
  validation:
    default_atol: 0.0001
    default_rtol: 0.001
    metric: torch_close
  version: 1
