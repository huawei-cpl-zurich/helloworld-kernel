kernel:
  description: MoE token dispatch by precomputed output-to-input ordering; expert
    sorting excluded.
  name: moe_token_permute
  namespace: team
schema_version: 2
spec:
  cases:
    recipe_file: recipes.yaml
    tensor_contract_file: tensor-contract.yaml
  interface:
    inputs:
    - tokens
    - positions
    outputs:
    - output
  reference:
    file: reference.py
    function: reference
  validation:
    default_atol: 0.0001
    default_rtol: 0.001
    metric: torch_close
  version: 1
